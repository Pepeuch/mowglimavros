name: Build MAVROS sidecar

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/pepeuch/mowglimavros/mowgli-mavros-sidecar

jobs:
  pins:
    runs-on: ubuntu-latest
    outputs:
      mavros_version: ${{ steps.pins.outputs.mavros_version }}
      mavros_commit: ${{ steps.pins.outputs.mavros_commit }}
      universal_gnss_repository: ${{ steps.pins.outputs.universal_gnss_repository }}
      universal_gnss_commit: ${{ steps.pins.outputs.universal_gnss_commit }}
      mavlink_version: ${{ steps.pins.outputs.mavlink_version }}
      geographiclib_dataset_version: ${{ steps.pins.outputs.geographiclib_dataset_version }}
      interface_source_revision: ${{ steps.interface.outputs.source_revision }}
      interface_fingerprint: ${{ steps.interface.outputs.fingerprint }}
      gnss_type_hash: ${{ steps.interface.outputs.gnss_type_hash }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve canonical interface lock
        id: interface
        run: |
          python3 - <<'PY'
          import json, os
          with open('ros2/src/mowgli_interfaces/interface-contract.lock.json') as source:
              lock = json.load(source)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('source_revision=' + lock['source_revision'], file=output)
              print('fingerprint=' + lock['fingerprint'], file=output)
              print('gnss_type_hash=' + lock['type_hashes']['msg/GnssStatus.msg'], file=output)
          PY

      - name: Checkout exact canonical interfaces
        uses: actions/checkout@v7
        with:
          repository: mowglinext/mowglinext
          ref: ${{ steps.interface.outputs.source_revision }}
          path: .interface-source
          sparse-checkout: ros2/src/mowgli_interfaces
          persist-credentials: false

      - name: Verify canonical source and contract regressions
        run: |
          python3 tools/mowgli_interface_contract.py check --source-root .interface-source/ros2/src/mowgli_interfaces
          python3 tools/test_mowgli_interface_contract.py

      - id: pins
        shell: bash
        run: |
          set -euo pipefail
          for name in MAVROS_VERSION MAVROS_COMMIT UNIVERSAL_GNSS_REPOSITORY UNIVERSAL_GNSS_COMMIT MAVLINK_VERSION GEOGRAPHICLIB_DATASET_VERSION; do
            value="$(sed -n "s/^ARG ${name}=//p" ros2/Dockerfile | head -n 1)"
            test -n "${value}"
            output="$(echo "${name}" | tr "[:upper:]" "[:lower:]")"
            echo "${output}=${value}" >> "$GITHUB_OUTPUT"
          done

  build:
    needs: pins
    name: ${{ matrix.ros_distro }} / ${{ matrix.architecture }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: lyrical
            platform: linux/amd64
            architecture: amd64
          - ros_distro: lyrical
            platform: linux/arm64
            architecture: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        id: buildx

      - name: Restore isolated ccache mount
        id: ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mowgli-mavros-ccache
          key: ccache-${{ runner.os }}-${{ matrix.ros_distro }}-${{ matrix.architecture }}-${{ needs.pins.outputs.mavros_version }}-${{ needs.pins.outputs.mavros_commit }}-${{ hashFiles('ros2/Dockerfile') }}

      - name: Inject ccache mount into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/mowgli-mavros-ccache
          cache-map: |
            {
              "ccache": {
                "target": "/ccache",
                "id": "ccache-${{ matrix.ros_distro }}-${{ matrix.architecture }}-${{ needs.pins.outputs.mavros_version }}"
              }
            }
          skip-extraction: ${{ steps.ccache.outputs.cache-hit }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ros2/Dockerfile
          platforms: ${{ matrix.platform }}
          pull: true
          push: true
          tags: ${{ env.IMAGE_NAME }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.ros_distro }}-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.source=https://github.com/Pepeuch/mowglimavros
            org.opencontainers.image.revision=${{ github.sha }}
            io.mowgli.interfaces.source-revision=${{ needs.pins.outputs.interface_source_revision }}
            io.mowgli.interfaces.fingerprint=${{ needs.pins.outputs.interface_fingerprint }}
            io.mowgli.interfaces.gnss-type-hash=${{ needs.pins.outputs.gnss_type_hash }}
          build-args: |
            ROS_DISTRO=${{ matrix.ros_distro }}
            MAVROS_VERSION=${{ needs.pins.outputs.mavros_version }}
            MAVROS_COMMIT=${{ needs.pins.outputs.mavros_commit }}
            UNIVERSAL_GNSS_REPOSITORY=${{ needs.pins.outputs.universal_gnss_repository }}
            UNIVERSAL_GNSS_COMMIT=${{ needs.pins.outputs.universal_gnss_commit }}
            MAVLINK_VERSION=${{ needs.pins.outputs.mavlink_version }}
            GEOGRAPHICLIB_DATASET_VERSION=${{ needs.pins.outputs.geographiclib_dataset_version }}
          cache-from: type=gha,scope=mowgli-mavros-${{ matrix.ros_distro }}-${{ needs.pins.outputs.mavros_version }}-${{ needs.pins.outputs.mavros_commit }}-${{ needs.pins.outputs.universal_gnss_commit }}-${{ needs.pins.outputs.mavlink_version }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=mowgli-mavros-${{ matrix.ros_distro }}-${{ needs.pins.outputs.mavros_version }}-${{ needs.pins.outputs.mavros_commit }}-${{ needs.pins.outputs.universal_gnss_commit }}-${{ needs.pins.outputs.mavlink_version }}-${{ matrix.architecture }}

  publish-manifest:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    needs: [pins, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: lyrical
            primary: true

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.ros_distro }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ matrix.primary && github.ref == 'refs/heads/main' }}
            type=ref,event=branch,suffix=-${{ matrix.ros_distro }}
            type=sha,prefix=sha-,suffix=-${{ matrix.ros_distro }}
            type=raw,value=sha-${{ github.sha }}-${{ matrix.ros_distro }}

      - name: Publish multi-architecture manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create \
              --tag "$tag" \
              "${IMAGE_NAME}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.ros_distro }}-amd64" \
              "${IMAGE_NAME}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.ros_distro }}-arm64"
          done <<< "$TAGS"
