name: Build MAVROS sidecar

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/pepeuch/mowglimavros/mowgli-mavros-sidecar
  MAVROS_VERSION: 2.15.1
  MAVROS_COMMIT: 22ae5b7cc7cdb4cb9c2070a8213c72dae445a23e
  MAVLINK_VERSION: 2026.8.8
  GEOGRAPHICLIB_DATASET_VERSION: geographiclib-datasets-v1

jobs:
  build:
    name: ${{ matrix.ros_distro }} / ${{ matrix.architecture }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: kilted
            platform: linux/amd64
            architecture: amd64
          - ros_distro: kilted
            platform: linux/arm64
            architecture: arm64
          - ros_distro: lyrical
            platform: linux/amd64
            architecture: amd64
          - ros_distro: lyrical
            platform: linux/arm64
            architecture: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        id: buildx

      - name: Restore isolated ccache mount
        id: ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mowgli-mavros-ccache
          key: ccache-${{ runner.os }}-${{ matrix.ros_distro }}-${{ matrix.architecture }}-${{ env.MAVROS_VERSION }}-${{ env.MAVROS_COMMIT }}-${{ hashFiles('ros2/Dockerfile') }}

      - name: Inject ccache mount into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/mowgli-mavros-ccache
          cache-map: |
            {
              "ccache": {
                "target": "/ccache",
                "id": "ccache-${{ matrix.ros_distro }}-${{ matrix.architecture }}-${{ env.MAVROS_VERSION }}"
              }
            }
          skip-extraction: ${{ steps.ccache.outputs.cache-hit }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ros2/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:build-${{ matrix.ros_distro }}-${{ matrix.architecture }}
          build-args: |
            ROS_DISTRO=${{ matrix.ros_distro }}
            MAVROS_VERSION=${{ env.MAVROS_VERSION }}
            MAVROS_COMMIT=${{ env.MAVROS_COMMIT }}
            MAVLINK_VERSION=${{ env.MAVLINK_VERSION }}
            GEOGRAPHICLIB_DATASET_VERSION=${{ env.GEOGRAPHICLIB_DATASET_VERSION }}
          cache-from: type=gha,scope=mowgli-mavros-${{ matrix.ros_distro }}-${{ env.MAVROS_VERSION }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=mowgli-mavros-${{ matrix.ros_distro }}-${{ env.MAVROS_VERSION }}-${{ matrix.architecture }}

  publish-manifest:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: kilted
            primary: true
          - ros_distro: lyrical
            primary: false

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.ros_distro }}
            type=raw,value=latest,enable=${{ matrix.primary }}
            type=ref,event=branch,suffix=-${{ matrix.ros_distro }}
            type=sha,prefix=sha-,suffix=-${{ matrix.ros_distro }}

      - name: Publish multi-architecture manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker buildx imagetools create \
              --tag "$tag" \
              "${IMAGE_NAME}:build-${{ matrix.ros_distro }}-amd64" \
              "${IMAGE_NAME}:build-${{ matrix.ros_distro }}-arm64"
          done <<< "$TAGS"
