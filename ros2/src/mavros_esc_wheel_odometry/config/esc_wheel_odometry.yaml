/**/esc_wheel_odometry:
  ros__parameters:
    # Wheel source selection only; ESC normalization is independent of geometry.
    source: auto
    observation_timeout_s: 3.0
    common_pair_max_skew_s: 0.25
    # One COMMON component owns all STATUS/INFO slots; -1 selects a live owner.
    esc_component_id: -1
    left_wheel_index: -1
    right_wheel_index: -1
    # -1 accepts one live encoder component of the target SYSID, including ESP32.
    wheel_distance_component_id: -1
    max_distance_speed_mps: 10.0
    # Proven installation defaults; remain configurable for other vehicles.
    left_esc_slot: 1
    right_esc_slot: 0
    left_rpm_instance: 2
    right_rpm_instance: 1
    expected_esc_telem_mav_offset: 0
    # Raw signed motor RPM, FCU RPMx_SCALING=1.0; one fractional tick = one revolution.
    # Calibrate ticks_per_meter with RTK; no wheel radius or gear ratio is assumed.
    ticks_per_meter: 0.0
    track_width_m: 0.0

    frame_id: odom
    child_frame_id: base_link
    velocity_stddev_mps: 0.1
