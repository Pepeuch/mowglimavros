hardware_bridge:
  ros__parameters:
    status_publish_rate_hz: 10.0

    manual_control_linear_scale: 1000.0
    manual_control_yaw_scale: 1000.0
    mowing_enabled: true
    # OFF-only ArduPilot contract; ON remains inhibited. Read-only after startup.
    blade_servo_channel: 3
    blade_neutral_pwm: 1500
    # Low-excursion acceptance baseline only; validate configuration per installation.
    blade_forward_pwm: 1450
    blade_reverse_pwm: 1550

    # Canonical Power is produced by the MAVROS battery_observer plugin.
    # This timeout is used only for bridge readiness/diagnostic freshness.
    battery_observation_timeout_s: 5.0

    # Mandatory source freshness for internal backend readiness diagnostics.
    # Dock power is informational and never blocks backend readiness.
    readiness_observation_timeout_s: 5.0
    esc_observation_timeout_s: 3.0
    # Compatibility defaults only; roles can be atomically changed at runtime.
    right_esc_slot: 0
    left_esc_slot: 1
    blade_esc_slot: 2
    gnss_required: true
    wheel_odometry_required: false

    tilt_emergency_ms: 500
    imu_inclination_threshold: 56
